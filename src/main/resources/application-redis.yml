spring:
  data:
    redis:
      url: ${REDIS_URL:}
      
      # SSL/TLS configuration
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      
      timeout: 5000ms
      
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms