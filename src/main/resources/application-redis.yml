spring:
  data:
    redis:
      # Upstash Redis URL (higher priority)
      url: ${REDIS_URL:}
      
      # Fallback to host/port/password if URL is not set
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      
      # SSL/TLS configuration
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      
      timeout: 5000ms
      
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms


